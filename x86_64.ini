[constants]
prefix = '/home/massimo/llvm'

c_flags = [
    '-nostdlib++',
    '-nostdinc'
    ]

[binaries]
c = [prefix / 'bin/clang'] + c_flags
cpp = [prefix / 'bin/clang++'] + c_flags
c_ld = 'lld'
cpp_ld = 'lld'
strip = prefix / 'bin/llvm-strip'
ar = prefix / 'bin/llvm-ar'
objcopy = prefix / 'bin/llvm-objcopy'

[built-in options]
c_link_args = ''
cpp_link_args = c_link_args
default_library = 'static'

