[constants]
prefix = '/home/massimo/llvm'

c_flags = [
    '--target=avr',
    '-mmcu=atmega328p',
    '-ffreestanding',
    '--sysroot=' + prefix
    ]

[binaries]
c = [prefix / 'bin/clang'] + c_flags
cpp = [prefix / 'bin/clang++'] + c_flags
c_ld = 'lld'
cpp_ld = 'lld'
strip = prefix / 'bin/llvm-strip'
ar = prefix / 'bin/llvm-ar'
objcopy = prefix / 'bin/llvm-objcopy'

[built-in options]
c_args = ['-fdata-sections', '-ffunction-sections']
cpp_args = c_args
c_link_args = ['-Wl,-T,' + '@GLOBAL_SOURCE_ROOT@/src/avr/atmega328p.ld', '-Wl,--gc-sections']
cpp_link_args = c_link_args
default_library = 'static'
b_staticpic = false
cpp_eh = 'none'
cpp_rtti = false
buildtype = 'debugoptimized'

[host_machine]
system = 'none'
kernel = 'none'
cpu_family = 'avr'
cpu = 'atmega328p'
endian = 'little'
